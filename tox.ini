[tox]
minversion = 4.0
envlist = py315
skip_missing_interpreters = true
labels =
    test = py315
    fast = py315-fast
    slow = py315-slow

[testenv]
description = Run the full project coverage workflow.
package = editable
extras = dev
setenv =
    COVERAGE_PROCESS_START = {toxinidir}/tox.ini
    COVERAGE_FILE = {toxworkdir}/.coverage
    TOX_PROJECT_ROOT = {toxinidir}
    PYTHONPATH = {toxinidir}{pathsep}{toxinidir}/scripts/cov_init
    # Intentionally inherited by all envs (e.g., py315-fast/py315-slow) via [testenv].
    PYTEST_DISABLE_PLUGIN_AUTOLOAD = 1
passenv =
    CI
    GITHUB_*
commands =
    python -m scripts.run_coverage_workflow

[testenv:py315-fast]
description = Run fast tests (exclude slow and integration markers).
commands =
    python -m pytest -m "not slow and not integration" {posargs:{toxinidir}/tests}

[testenv:py315-slow]
description = Run slow and integration test markers.
commands =
    python -m pytest -m "slow or integration" {posargs:{toxinidir}/tests}

[coverage:run]
source = telegraphy
relative_files = True
parallel = True
branch = True

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 90
