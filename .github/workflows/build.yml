name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
      - name: Show resolved Python version
        run: python --version
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run Ruff
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run mypy (strict)
        run: mypy telegraphy
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest

  sonar-token-check:
    name: SonarQube Token Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    outputs:
      has_sonar_token: ${{ steps.detect.outputs.has_sonar_token }}
    steps:
      - name: Detect SONAR_TOKEN availability
        id: detect
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_sonar_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sonar_token=false" >> "$GITHUB_OUTPUT"
          fi

  sonarqube-skipped:
    name: SonarQube (Skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, sonar-token-check]
    if: ${{ needs.sonar-token-check.outputs.has_sonar_token == 'false' }}
    steps:
      - name: Explain skip reason
        run: |
          echo "Skipping SonarQube scan because SONAR_TOKEN is unavailable for this workflow context."
          echo "This is expected for pull requests from forks and other contexts where repository secrets are not exposed."

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, sonar-token-check]
    if: ${{ needs.sonar-token-check.outputs.has_sonar_token == 'true' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run tests with coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m telegraphy.scripts.run_coverage_workflow

      - name: Confirm coverage report exists
        run: |
          test -f coverage.xml
          head -20 coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
